<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غير متصل · Offline — AH Legal OS</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f6f3; color: #0c1424;
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; padding: 16px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #070b12; color: #e7eaf0; } .card { background: #0f1623; border-color: #1f2937; } }
  .card { max-width: 420px; width: 100%; background: #fff; border: 1px solid #e5e5e0; border-radius: 12px; padding: 28px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 6px; opacity: .8; }
  button { margin-top: 16px; font: inherit; padding: 8px 18px; border-radius: 8px; border: 0; background: #0c1424; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <main class="card">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>لحماية بيانات العملاء، لا يحفظ النظام الملفات أو بيانات القضايا على الجهاز.</p>
    <h1 lang="en" dir="ltr" style="margin-top:18px">You're offline</h1>
    <p lang="en" dir="ltr">To protect client data, case information is never stored on this device.</p>
    <button onclick="location.reload()">إعادة المحاولة · Retry</button>
  </main>
</body>
</html>
